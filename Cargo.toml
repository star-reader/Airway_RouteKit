[package]
name = "airway_routekit"
version = "0.1.0"
edition = "2021"
authors = ["SKYline Team"]
license = "MIT"
description = "A high-performance toolkit for flight route calculation and navigation string parsing."
repository = "https://github.com/star-reader/Airway_RouteKit"
keywords = ["aviation", "routing", "navigation", "flight-planning"]
categories = ["aerospace", "algorithms"]

[lib]
name = "routekit"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.10"
lazy_static = "1.4"
geo = "0.28"
geo-types = "0.7"
# FFI
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.9"

[[bench]]
name = "route_search"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
